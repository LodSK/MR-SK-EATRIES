worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 5m;

  gzip on;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml+rss
    application/xml image/svg+xml font/woff2;

  upstream frontend_upstream {
    server frontend:3000;
  }

  upstream backend_upstream {
    server backend:5000;
  }

  # Basic edge-level throttling, in addition to (not instead of) the
  # application-level rate limiting in backend/src/middleware/rateLimiter.middleware.ts.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  # Plain HTTP exists only to redirect to HTTPS — the refresh-token cookie
  # is Secure whenever NODE_ENV=production (auth.controller.ts) and won't
  # be stored or sent by the browser over plain HTTP at all.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    # See docker-entrypoint.sh — self-signed for local/staging verification.
    # Replace with a real certificate (Let's Encrypt/certbot or your cloud
    # provider's load balancer) before a real deployment; see DEPLOYMENT.md.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Defense in depth alongside helmet() (backend) and Next.js's own
    # headers() config (frontend/next.config.ts) — redundant on paths those
    # already cover, but this is also the front door for anything neither
    # of them touches.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    limit_req zone=general burst=40 nodelay;

    # Express's own /health (app.ts) — checked directly, not proxied under
    # /api, since it's an infra endpoint, not a versioned API route.
    location = /health {
      proxy_pass http://backend_upstream/health;
      access_log off;
    }

    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # socket.io needs the Upgrade/Connection headers for the WebSocket
    # handshake — a plain proxy_pass alone silently falls back to
    # long-polling only.
    location /socket.io/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
